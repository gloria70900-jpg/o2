<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Dark Dome VR Stage</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 100;
      background: rgba(10, 12, 18, 0.9);
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
    }
    .custom-file-upload {
      border: 2px dashed #00e5ff;
      color: #fff;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .custom-file-upload:hover {
      background: rgba(0, 229, 255, 0.15);
    }
    input[type="file"] {
      display: none;
    }
    #enter-xr {
      display: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #0051ff, #00d4ff);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 122, 255, 0.5);
    }
    #enter-xr:hover {
      filter: brightness(1.15);
    }
    #file-status {
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <label class="custom-file-upload">
      📁 영상 파일 선택 (.mp4)
      <input type="file" id="video-input" accept="video/mp4,video/*">
    </label>
    <div id="file-status">영상을 선택해 주세요.</div>
    <button id="enter-xr">🌌 거대 암흑 돔 입장 (Enter VR)</button>
  </div>

  <video id="video" loop playsinline crossOrigin="anonymous" style="display:none;"></video>

  <script>
    const video = document.getElementById('video');
    const videoInput = document.getElementById('video-input');
    const enterBtn = document.getElementById('enter-xr');
    const fileStatus = document.getElementById('file-status');
    const uiContainer = document.getElementById('ui-container');

    // 1. 영상 로드
    videoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        video.src = URL.createObjectURL(file);
        video.load();
        fileStatus.innerText = `선택됨: ${file.name}`;
        fileStatus.style.color = '#00e5ff';
        enterBtn.style.display = 'block';
      }
    });

    // 2. 기본 Scene 및 Camera 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010103); // 완전한 심연의 블랙

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 카메라 리그(VR 관찰자 위치): 돔 반경이 50m일 때, 가장자리 끝(Z = +45m)에 서서 중심/반대편(-Z)을 바라봄
    const cameraRig = new THREE.Group();
    cameraRig.position.set(0, 1.6, 45); 
    scene.add(cameraRig);
    cameraRig.add(camera);

    // 3. 반경 50m의 거대한 암흑 돔 (Mega Dark Dome)
    const domeRadius = 50;
    const domeGeo = new THREE.SphereGeometry(domeRadius, 60, 40);
    domeGeo.scale(-1, 1, 1); // 내부 렌더링
    const domeMat = new THREE.MeshBasicMaterial({
      color: 0x020307,
      wireframe: false
    });
    const darkDome = new THREE.Mesh(domeGeo, domeMat);
    scene.add(darkDome);

    // 원근감과 웅장함을 배가하는 바닥 희미한 그리드
    const grid = new THREE.GridHelper(90, 45, 0x112233, 0x050b14);
    grid.position.y = 0;
    scene.add(grid);

    // 4. 그린스크린 제거 크로마키 셰이더
    const videoTexture = new THREE.VideoTexture(video);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;

    const chromaMaterial = new THREE.ShaderMaterial({
      uniforms: {
        tex: { value: videoTexture },
        keyColor: { value: new THREE.Color(0.42, 0.90, 0.55) },
        threshold: { value: 0.38 },
        feather: { value: 0.12 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tex;
        uniform vec3 keyColor;
        uniform float threshold;
        uniform float feather;
        varying vec2 vUv;

        void main() {
          vec4 color = texture2D(tex, vUv);
          float dist = distance(color.rgb, keyColor);
          float alpha = smoothstep(threshold, threshold + feather, dist);

          if (dist < threshold + feather * 2.0) {
            color.g = min(color.g, max(color.r, color.b) * 1.05);
          }

          gl_FragColor = vec4(color.rgb, color.a * alpha);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide
    });

    // 5. 돔 반대편(Z = -30m ~ -40m 부근)에 배치되는 초대형 곡면 스크린 (너비 약 45m, 높이 24m)
    const screenRadius = 40;
    const screenHeight = 24;
    const arcLength = 1.2; // 약 70도 곡면 화각
    const stageGeo = new THREE.CylinderGeometry(
      screenRadius, screenRadius, screenHeight, 64, 1, true,
      Math.PI * 1.5 - arcLength / 2, arcLength
    );
    stageGeo.scale(-1, 1, 1);

    const screenMesh = new THREE.Mesh(stageGeo, chromaMaterial);
    // 관찰자(Z=+45) 기준 반대편 깊숙한 곳(Z=-5)에 거대 스케일로 배치
    screenMesh.position.set(0, screenHeight / 2 - 1.0, -5);
    scene.add(screenMesh);

    // 6. WebXR 'immersive-vr' 세션 (거실 투과 없는 순수 VR 돔)
    enterBtn.addEventListener('click', async () => {
      video.play();
      if (navigator.xr) {
        const session = await navigator.xr.requestSession('immersive-vr', {
          optionalFeatures: ['local-floor', 'bounded-floor']
        });
        renderer.xr.setSession(session);
        uiContainer.style.display = 'none';

        session.addEventListener('end', () => {
          uiContainer.style.display = 'flex';
          video.pause();
        });
      }
    });

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
